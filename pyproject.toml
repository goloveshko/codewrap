[project]
name = "codewrap"
version = "0.2.0"
description = "Professional LLM context gatherer for source code bases"
readme = "README.md"
authors = [
    { name = "Sergey", email = "8836169+goloveshko@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["cli", "llm", "context", "prompt", "gpt", "tiktoken", "code-parser", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pathspec>=0.12.0",
    "pydantic>=2.0.0",
    "pyperclip>=1.8.2",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "typer>=0.12.0",
]

[project.scripts]
codewrap = "codewrap.main:app"

[build-system]
requires = ["uv_build>=0.4.0,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
	"pytest>=8.0.0",
	"types-pyperclip>=1.8.0",
]

# --- RUFF CONFIGURATION ---

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# Selected rules:
# B: flake8-bugbear (common bug traps)
# E, W: pycodestyle errors & warnings
# F: Pyflakes (unused imports, undefined variables)
# I: isort (automatic import sorting)
# UP: pyupgrade (modern Python 3.10+ syntax suggestions)
select = ["B", "E", "F", "W", "I", "UP"]
ignore = ["E501", "B008"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "google"