[project]
name = "codewrap"
version = "0.2.0"
description = "Профессиональный сборщик контекста исходного кода в Markdown для LLM"
readme = "README.md"
authors = [
    { name = "Sergey", email = "8836169+goloveshko@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["cli", "llm", "context", "prompt", "gpt", "tiktoken", "code-parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pathspec>=0.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8.2"]

[project.scripts]
codewrap = "codewrap.main:app"

[build-system]
requires = ["uv_build>=0.4.0,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]